version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - next
          - '@next/*'
      supabase:
        patterns:
          - '@supabase/*'
      sentry:
        patterns:
          - '@sentry/*'
      types:
        patterns:
          - '@types/*'
        update-types:
          - patch
          - minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
