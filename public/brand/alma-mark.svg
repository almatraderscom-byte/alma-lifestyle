<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="tile" cx="50%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#1e1836"/>
      <stop offset="58%" stop-color="#0b0a12"/>
      <stop offset="100%" stop-color="#07060c"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="12%" y1="8%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="48%" stop-color="#b25cff"/>
      <stop offset="100%" stop-color="#d8a94e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecc074"/>
      <stop offset="100%" stop-color="#d8a94e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#7c5cff" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- dark tile -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#tile)"/>

  <!-- breathing aura (static) -->
  <circle cx="60" cy="60" r="46" fill="url(#aura)"/>

  <!-- outer ring: violet -> magenta -> gold, gap at bottom, rotated for energy -->
  <path d="M 39 96.37 A 42 42 0 1 1 81 96.37" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" transform="rotate(-18 60 60)"/>

  <!-- inner ring: gold, gap at top -->
  <path d="M 79.8 40.2 A 28 28 0 1 1 40.2 40.2" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" transform="rotate(24 60 60)"/>

  <!-- centre A -->
  <g filter="url(#glow)" fill="none" stroke="#f4f0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 50 74 L 60 46 L 70 74"/>
    <path d="M 54.2 64 L 65.8 64"/>
  </g>
</svg>
